<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Platform 1 Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Shrikhand&family=Press+Start+2P&family=Noto+Sans+Devanagari:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16283a; --paper:#fff8ea; --paper2:#f6ead2; --mute:#5d6b78; --line:rgba(22,40,58,.16);
  --sea:#14807f; --coral:#e2492f; --sun:#f4b12e; --sky1:#ffe3b3; --sky2:#a9e0d6; --room:#0f2430;
  --disp:'Shrikhand',Georgia,serif; --body:'DM Sans',system-ui,-apple-system,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace; --hand:'Caveat','Comic Sans MS',cursive;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --ink:#f4ead6; --paper:#182836; --paper2:#213547; --mute:#a7b4bf; --line:rgba(255,255,255,.16); --sky1:#33485c; --sky2:#1c4b55; --room:#081419; }
}
:root[data-theme="dark"]{ --ink:#f4ead6; --paper:#182836; --paper2:#213547; --mute:#a7b4bf; --line:rgba(255,255,255,.16); --sky1:#33485c; --sky2:#1c4b55; --room:#081419; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--room);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;display:flex;justify-content:center;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#app{position:relative;width:100%;max-width:440px;height:100%;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2) 70%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

#top{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;gap:8px;align-items:flex-start;padding:10px 12px;pointer-events:none}
#obj{pointer-events:auto;flex:1;min-width:0;background:var(--paper);border-radius:14px;padding:7px 12px 8px;box-shadow:0 3px 0 var(--line)}
#obj small{display:block;font-size:12px;color:var(--mute)}
#obj b{display:block;font-size:15px;line-height:1.25}
.ib{pointer-events:auto;width:46px;height:46px;border-radius:14px;background:var(--paper);box-shadow:0 3px 0 var(--line);font-size:22px;font-weight:700;display:grid;place-items:center;flex:none}
.ib:active,.bb:active{transform:translateY(2px);box-shadow:none}
#btnMute.off{opacity:.55;text-decoration:line-through}

#toast{position:absolute;left:12px;right:12px;top:76px;z-index:6;background:var(--ink);color:var(--paper);border-radius:14px 14px 14px 4px;padding:10px 14px;font-size:15px;transform:translateY(-8px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.on{opacity:1;transform:none;pointer-events:auto}
#toast i{font-style:normal;font-weight:700;color:var(--sun);margin-right:6px}

#dock{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:0 0 10px}
#chips{display:flex;gap:6px;overflow-x:auto;padding:6px 12px 8px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:44px;padding:0 14px;border-radius:22px;background:var(--paper);box-shadow:0 3px 0 var(--line);font-size:14px;font-weight:500;position:relative}
.chip.todo::after{content:"";position:absolute;right:6px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--coral)}
#bar{display:flex;gap:6px;padding:0 12px;align-items:center}
.bb{height:48px;padding:0 7px;border-radius:14px;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;box-shadow:0 3px 0 var(--line);flex:1;white-space:nowrap}
.bb em{font-style:normal;background:var(--sun);color:#16283a;border-radius:9px;padding:1px 7px;margin-left:4px;font-size:12px}
.bb.alt{background:var(--coral);color:#fff8ea}
.bb.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(244,177,46,.45)}}
#bar .ib{width:44px;height:48px}

#scrim{position:absolute;inset:0;z-index:8;background:rgba(8,20,25,.45)}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;max-height:84%;overflow-y:auto;overscroll-behavior:contain;background:var(--paper);border-radius:22px 22px 0 0;padding:18px 18px 22px;box-shadow:0 -6px 30px rgba(0,0,0,.25);animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:.4}}
#sheetX{position:sticky;top:0;float:right;margin:-6px -6px 0 8px;box-shadow:none;background:var(--paper2);z-index:2}
.where{font-size:13px;color:var(--coral);font-weight:700;margin:0 0 2px}
#sheet h2{font-size:21px;line-height:1.2;margin:0 0 10px;font-weight:700}
#sheet p{margin:0 0 12px}
.note{font-family:var(--hand);font-size:21px;line-height:1.2;color:var(--sea)}
.btn{display:block;width:100%;min-height:50px;border-radius:14px;background:var(--coral);color:#fff8ea;font-weight:700;font-size:16px;margin-top:8px;box-shadow:0 3px 0 var(--line)}
.btn.ghost{background:var(--paper2);color:var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:none}

.prop{margin:4px 0 14px}
.p-svg{display:block;width:100%;height:auto;border-radius:10px}
.p-watch{width:168px;height:168px;margin:0 auto;border-radius:44px;background:#0b0f14;border:8px solid #2a3038;color:#d9ffe6;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);text-align:center}
.p-watch small{font-size:10px;color:#7da38c}.p-watch b{font-size:34px;line-height:1;color:#ff6b57;margin:2px 0}.p-watch svg{width:120px;height:24px}.p-watch em{font-style:normal;font-size:11px;color:#fff}
.p-rcpt{width:230px;margin:0 auto;background:#fffef6;color:#23262b;font-family:var(--mono);font-size:12.5px;line-height:1.5;padding:14px 14px 18px;white-space:pre;border-bottom:3px dashed #cfc7b2;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.p-rcpt b{background:#ffe27a}
.p-deed{background:#fbf5e2;color:#2b2a26;border:1px solid #d8cdae;padding:14px 16px;font-family:Georgia,serif;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.p-deed h3{margin:0 0 6px;font-size:15px;letter-spacing:.04em;text-align:center}
.p-deed .sig{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #6d6a5e;height:40px;margin-top:6px;font-size:12px}
.p-deed .sig span{font-family:var(--hand);font-size:26px;color:#1b3f8a}
.p-deed .sig .no{color:#c62b1b;font-size:34px;font-weight:700;transform:rotate(-7deg)}
.p-log{background:#fdf7df repeating-linear-gradient(#0000 0 27px,#b9cbe6 27px 28px);color:#1d3a78;font-family:var(--hand);font-size:21px;line-height:28px;padding:6px 14px 8px 30px;border-left:3px solid #e3a09a;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.p-sign{background:#e2492f;color:#fff3d6;border:4px solid #fff3d6;outline:3px solid #e2492f;text-align:center;padding:10px;font-family:var(--disp);font-size:30px;line-height:1.1;margin:3px}
.p-sign small{display:block;font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.08em}

.ph{background:#0e161f;color:#e9eff5;border-radius:26px;padding:18px 16px;max-width:310px;margin:0 auto 6px;border:6px solid #2a323c}
.ph .clock{font-size:44px;font-weight:500;text-align:center;line-height:1}
.ph .hint{text-align:center;font-size:13px;color:#93a4b5;margin:4px 0 12px}
.dots{display:flex;gap:12px;justify-content:center;margin-bottom:14px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #e9eff5}.dots i.f{background:#e9eff5}
.dots.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;justify-items:center}
.pad button{width:60px;height:60px;border-radius:50%;background:#222c38;color:#fff;font-size:24px}
.pad button:active{background:#3a4858}
.msg{border-radius:14px;padding:8px 12px;margin:6px 0;font-size:14px;max-width:88%}
.msg.in{background:#222c38}.msg.out{background:#1c6b5c;margin-left:auto}
.msg small{display:block;color:#93a4b5;font-size:11px}
.msg.vn{border:1px dashed #6fd3c4}
.thread{font-size:12px;color:#93a4b5;margin:12px 0 2px}

.cam canvas{width:100%;height:auto;display:block;border-radius:10px;background:#03130b}
.camnav{display:flex;gap:8px;align-items:center;margin:8px 0}
.camnav button{width:52px;height:48px;border-radius:14px;background:var(--paper2);font-size:22px;font-weight:700}
.camnav span{flex:1;text-align:center;font-family:var(--mono);font-size:14px}

.who{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.who img{width:64px;height:64px;border-radius:14px;image-rendering:pixelated;flex:none}
.who h2{margin:0!important}.who small{color:var(--mute);font-size:13px}
.log .q{background:var(--ink);color:var(--paper);border-radius:14px 14px 4px 14px;padding:8px 12px;margin:8px 0 6px auto;max-width:85%;width:fit-content;font-size:14px}
.log .a{background:var(--paper2);border-radius:14px 14px 14px 4px;padding:10px 12px;margin:0 0 6px;max-width:92%}
.ask{display:block;width:100%;text-align:left;min-height:48px;border-radius:14px;border:2px solid var(--line);padding:8px 12px;margin-top:8px;font-weight:500}
.ask.done{opacity:.55}
.ask.press{border-color:var(--coral);color:var(--coral)}

.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;height:44px;border-radius:12px;background:var(--paper2);font-weight:700}
.tabs button.on{background:var(--ink);color:var(--paper)}
.grp{font-size:13px;color:var(--mute);margin:12px 0 2px}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;text-align:left;border-bottom:1px solid var(--line);padding:6px 0}
.row img{width:44px;height:44px;border-radius:10px;image-rendering:pixelated}
.row span{flex:1}.row small{display:block;color:var(--mute);font-size:13px}
.row.x span{text-decoration:line-through;opacity:.5}
.row .mk{width:44px;height:44px;border-radius:12px;background:var(--paper2);display:grid;place-items:center;font-weight:700}
.sus{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sus button{background:var(--paper2);border-radius:16px;padding:12px 8px;text-align:center;font-weight:700;font-size:14px;min-height:120px}
.sus img{width:64px;height:64px;border-radius:14px;image-rendering:pixelated;display:block;margin:0 auto 6px}

#intro,#finale{position:absolute;inset:0;overflow-y:auto;padding:26px 22px 30px}
#intro{z-index:20;background:linear-gradient(180deg,#ffc98a 0%,#ff9a86 34%,#4f9a52 34.2%,#2c6b45 100%);color:#fff8ea;display:flex;flex-direction:column}
#intro .sunny{position:absolute;left:50%;top:13%;width:150px;height:150px;margin-left:-75px;border-radius:50%;background:#ffe9a8;opacity:.9}
#intro h1{position:relative;font-family:var(--disp);font-weight:400;font-size:74px;line-height:.86;margin:16% 0 0;text-shadow:0 4px 0 rgba(22,40,58,.35)}
#intro h1 span{display:block;font-size:30px;margin-top:10px}
#intro .card{position:relative;margin-top:auto;background:#fff8ea;color:#16283a;border-radius:18px;padding:16px 16px 14px;transform:rotate(-1.2deg);box-shadow:0 8px 0 rgba(0,0,0,.2)}
#intro .card p{margin:0 0 8px}
#intro .how{position:relative;font-size:14px;margin:16px 0 10px;opacity:.95}
#intro .btn{position:relative;background:#f4b12e;color:#16283a}
#finale{z-index:15;background:var(--paper)}
#finale h1{font-family:var(--disp);font-weight:400;font-size:40px;line-height:1;margin:6px 0 16px;color:var(--coral)}
#finale .fl{opacity:0;animation:fin .6s forwards}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#finale blockquote{margin:16px 0;padding:12px 16px;background:var(--paper2);border-radius:14px;font-family:var(--hand);font-size:23px;line-height:1.2}
.stats{display:flex;gap:8px;margin:14px 0}
.stats div{flex:1;background:var(--paper2);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-size:22px}.stats small{font-size:12px;color:var(--mute)}
.rank{font-family:var(--disp);font-size:26px;text-align:center;margin:10px 0 4px}
#shareTxt{width:100%;min-height:92px;border-radius:12px;border:2px solid var(--line);background:var(--paper2);color:var(--ink);font:inherit;font-size:14px;padding:10px;resize:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#finale .fl{opacity:1}}
#pick{position:absolute;inset:0;z-index:19;overflow-y:auto;padding:22px 16px 26px;background:var(--paper)}
#pick h2{font-family:var(--disp);font-weight:400;font-size:30px;line-height:1.05;margin:0 0 6px}
#pick p{margin:0 0 4px;color:var(--mute);font-size:15px}
.pc{display:flex;gap:12px;width:100%;text-align:left;background:var(--paper2);border-radius:16px;padding:12px;margin-top:10px;border:3px solid transparent;position:relative}
.pc.on{border-color:var(--coral)}
.pc.on::after{content:"Playing";position:absolute;right:10px;top:10px;background:var(--coral);color:#fff8ea;border-radius:9px;padding:1px 8px;font-size:12px;font-weight:700}
.pc img{width:64px;height:64px;border-radius:14px;image-rendering:pixelated;flex:none}
.pc b{display:block;font-size:17px;line-height:1.2}
.pc small{display:block;color:var(--mute);font-size:13px;margin-bottom:5px}
.pc span{display:block;font-size:14px;line-height:1.3}
.pc .pw{color:var(--sea);font-weight:700}.pc .wk{color:var(--coral);font-weight:700}
#lives{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
#lives i{width:10px;height:10px;border-radius:50%;background:var(--coral);display:inline-block}
#lives i.off{background:var(--line)}
.ab{display:flex;gap:10px;align-items:flex-start;background:var(--paper2);border-radius:14px;padding:10px;border-left:4px solid var(--sea);margin:0 0 12px;font-size:15px}
.ab img{width:40px;height:40px;border-radius:10px;image-rendering:pixelated;flex:none}
.lifeout{font-family:var(--disp);font-size:34px;line-height:1;color:var(--coral);margin:0 0 10px!important}
.btn[disabled]{opacity:.45}

#mini{position:absolute;right:30px;top:88px;transform:rotate(45deg);z-index:5;width:100px;height:95px;border-radius:12px;border:3px solid var(--paper);box-shadow:0 3px 0 var(--line);background:#16283a;pointer-events:auto;cursor:pointer}
#toast{right:156px}
#joy{position:absolute;z-index:4;width:100px;height:100px;border-radius:50%;background:rgba(255,248,234,.25);border:2px solid rgba(255,248,234,.7);pointer-events:none}
#joyK{position:absolute;left:26px;top:26px;width:44px;height:44px;border-radius:50%;background:rgba(255,248,234,.9)}
#btnAct{position:absolute;left:7%;right:7%;bottom:188px;z-index:6;min-height:52px;padding:6px 18px;border-radius:26px;background:var(--sun);color:#16283a;font-weight:700;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#arrow{position:absolute;left:12px;top:150px;z-index:5;background:var(--ink);color:var(--paper);border-radius:18px;padding:4px 12px;display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}
#arrow b{display:inline-block;color:var(--sun);font-size:18px;line-height:1}
#fade{position:absolute;inset:0;z-index:7;background:#16283a;opacity:0;pointer-events:none;transition:opacity .2s}
#fade.on{opacity:1}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 0 2px rgba(22,40,58,.4);z-index:3;pointer-events:none}
#cash{float:right;font-weight:700;color:var(--ink)}
#intro .card ul{margin:0 0 8px;padding-left:20px}
#intro .card li{margin-bottom:6px}
#intro h1{margin-top:8%;font-size:60px}
#obj{cursor:pointer}
#app.shoot #top,#app.shoot #dock,#app.shoot #mini,#app.shoot #arrow,#app.shoot #vctl{display:none!important}
#shoot{position:absolute;inset:0;z-index:6;pointer-events:none}
#shoot button{pointer-events:auto}
.vf i{position:absolute;width:34px;height:34px;border:3px solid rgba(255,255,255,.9)}
.vf i:nth-child(1){left:18px;top:18px;border-right:0;border-bottom:0}
.vf i:nth-child(2){right:18px;top:18px;border-left:0;border-bottom:0}
.vf i:nth-child(3){left:18px;bottom:128px;border-right:0;border-top:0}
.vf i:nth-child(4){right:18px;bottom:128px;border-left:0;border-top:0}
#shootTop{position:absolute;left:60px;right:60px;top:24px;text-align:center;color:#fff;font-weight:700;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
#shootSub{display:block;font-weight:500;color:#ffe27a;min-height:20px}
#shootMsg{position:absolute;left:24px;right:24px;bottom:136px;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.7)}
#shootBar{position:absolute;left:0;right:0;bottom:26px;display:flex;align-items:center;justify-content:center;gap:20px}
#shGo{width:76px;height:76px;border-radius:50%;background:#fff;border:6px solid rgba(255,255,255,.45);background-clip:padding-box;flex:none}
#shGo:active{transform:scale(.92)}
#shSun{flex:none;background:rgba(22,40,58,.8);color:#fff8ea}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}
#flash.on{animation:flashA .35s}
@keyframes flashA{0%{opacity:.9}100%{opacity:0}}
#coopTag{position:absolute;right:12px;top:232px;z-index:5;background:var(--ink);color:var(--paper);border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700}
#mode{position:absolute;inset:0;z-index:19;overflow-y:auto;padding:22px 16px 26px;background:var(--paper)}
#mode h2{font-family:var(--disp);font-weight:400;font-size:30px;line-height:1.05;margin:0 0 6px}
#mode p{margin:0 0 4px;color:var(--mute);font-size:15px}
#mode input{width:100%;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--paper2);color:var(--ink);font:inherit;font-size:18px;padding:0 14px;margin:8px 0 0}
.pc.taken{opacity:.45}
.album{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.album button{padding:0;border-radius:10px;overflow:hidden}
.album img{display:block;width:100%}
#clock{margin-left:8px;font-weight:700;color:var(--ink)}
.tabs button{font-size:13px}
#intro .tajsil{position:absolute;left:50%;bottom:65.8%;width:250px;margin-left:-125px;opacity:.42}
#hot{pointer-events:none;display:flex;gap:6px;justify-content:center;padding:0 12px 8px}
#hot button{pointer-events:auto;position:relative;width:46px;height:46px;border-radius:10px;background:#213547;border:3px solid rgba(255,248,234,.4);padding:0;flex:none;box-shadow:0 3px 0 var(--line)}
#hot button.on{border-color:#f4b12e}
#hot img{width:34px;height:34px;image-rendering:pixelated;display:block;margin:3px auto 0}
#hot em{position:absolute;right:2px;bottom:0;font-style:normal;font-size:12px;font-weight:700;color:#fff8ea;text-shadow:0 1px 0 #000,1px 0 0 #000}
.ic{width:40px;height:40px;box-sizing:border-box;padding:3px;background:#213547;border-radius:8px;image-rendering:pixelated;flex:none}
.rc{display:flex;align-items:center;gap:6px;background:var(--paper2);border-radius:14px;padding:8px;margin:8px 0}
.rc b{font-size:15px;line-height:1.2}
.rc small{color:var(--mute);font-weight:400}
.rc .btn{width:auto;min-width:72px;min-height:44px;margin:0 0 0 auto;padding:0 14px;flex:none}
.rc .ar{color:var(--mute);font-size:12px}
.rn{margin:-4px 0 10px;font-size:14px;color:var(--mute)}
.btn:disabled{opacity:.45}
#vctl{position:absolute;right:12px;top:214px;z-index:5;display:flex;flex-direction:column;gap:8px}
#vctl .ib{width:44px;height:44px;font-size:21px}
.row .mk{flex:none}
.row small{font-weight:400}

function goalFor(k,n){
  n=n||1;var i,j,r,s,name=nm(k);
  for(i=0;i<RECIPES.length;i++)if(RECIPES[i].k===k){r=RECIPES[i];var need={},ks=[];r.need.forEach(function(q){if(!need[q]){need[q]=0;ks.push(q);}need[q]++;});
    for(j=0;j<ks.length;j++)if(cnt(ks[j])<need[ks[j]])return goalFor(ks[j],need[ks[j]]);
    return {id:nearestHS(WORK.map(function(w){return w.id;})),t:'Make the '+name+' at a workbench'};}
  s=SRC[k];
  if(s){var who=TRAIL[TIDX[s[1]]].who;
    if(s[0]==='swap'){if(cnt(s[2])<1)return goalFor(s[2],1);return {id:s[1],t:'Swap the '+nm(s[2])+' with '+who};}

  if(!ids.length)ids=NODES.filter(function(q){return q.k===k;}).map(function(q){return q.id;});

      [-.17,.17].forEach(function(x){var c=new THREE.Mesh(new THREE.BoxGeometry(.2,.14,.2),new THREE.MeshLambertMaterial({color:0x2b2f36}));c.position.set(x,.85,.3);dm.add(c);cuffs.push(c);});
      var ch=new THREE.Mesh(new THREE.BoxGeometry(.2,.04,.04),new THREE.MeshLambertMaterial({color:0xc8ccd2}));ch.position.set(0,.85,.32);dm.add(ch);cuffs.push(ch);
      dm.updateMatrixWorld(true);}

    renderer.setSize(1280,720,false);pcam.aspect=16/9;

    skyTick();pcam.updateMatrixWorld();renderer.render(scene,pcam);url=renderer.domElement.toDataURL('image/jpeg',.9)||'';
  }catch(e){url='';}

function clockTick(){
  $('#obj').classList.toggle('urgent',!!S.started&&!S.done&&!S.lost&&clockMin()>=680);
  if(!S.started||S.done)return;
  var m=clockMin(),k;
  if(TRAINM&&m>=705&&!S.lost||(S.lost&&TRAINM)){
    if(!TRAINM.visible){TRAINM.visible=true;sfx.bell();camHold=T+6;say('The Express is here.',3000,'Station');}
    k=S.lost?1:Math.min(1,(m-705)/14);TRAINM.position.x=-205+239*sm(0,1,k);
  }
  if(S.lost)return;
  if(m>=570&&!S.evc){S.evc=1;saveState();say('Passengers are arriving.',2500,'Station');}
  if(m>=600&&S.warn<1){S.warn=1;say('It’s ten already. Two hours till the Express.',3000,'Constable Pandey');}
  else if(m>=630&&S.warn<2){S.warn=2;dropSignals();say('The signal’s down. The Express is close, hurry up.',3000,'Constable Pandey');}
  else if(m>=680&&S.warn<3){S.warn=3;whistle();say('Two minutes left! Who did it?',3000,'Constable Pandey');}
  if(m>=720){
    S.lost=1;COL.push({x0:-30,x1:38,z0:-8.5,z1:-5.5});saveState();sfx.bad();hud();
    if(shoot.on)exitShoot();
    if(sheet.hidden)loseView();else setTimeout(loseView,1500);
  }
}

function addTeam(){
  if(teamAdded||!S.me)return;teamAdded=true;
  lead=solo(mChar,P.x,P.z,Object.assign({rot:P.face,s:scaleOf(S.me),y:groundAt(P.x,P.z)},PAL[S.me]));
  pin=new THREE.Mesh(mkGeo,new THREE.MeshBasicMaterial({color:0xf4b12e,depthTest:false,transparent:true}));pin.scale.setScalar(.5);pin.renderOrder=30;scene.add(pin);
  AV.forEach(function(a){
    if(a.id===S.me)return;
    var c=solo(mChar,a.x,a.z,Object.assign({rot:a.rot,s:scaleOf(a.id),y:groundAt(a.x,a.z)},PAL[a.id]));helpers[a.id]=c;hot(a.id,'help',headOf(c,2.3));
    if(S.hired.indexOf(a.id)>=0&&S.players.indexOf(a.id)<0){c.position.set(P.x-.8,groundAt(P.x-.8,P.z+.8),P.z+.8);addFollower(c);}

function recalc(){
  var ch=0;S.chests.forEach(function(c){if(CHI[c])ch+=CHI[c].cash;});
  S.cash=Math.max(0,30+10*S.coins.length+20*S.paidA.length+15*S.shots.length+5*S.acts.length+3*S.brk.length+ch-(S.spent||0));
}
function fixState(){
  ['fog','areas','coins','players','hired','paidA','shots','acts','team','chests','gear','met','brk','inv','clues'].forEach(function(k){if(!Array.isArray(S[k]))S[k]=[];});
  var i,s;for(i=0;i<5;i++){s=S.inv[i];S.inv[i]=(Array.isArray(s)&&ITEMS[s[0]]&&s[1]>0)?[s[0],Math.min(9,Math.floor(s[1]))]:null;}S.inv.length=5;
  if(!S.gn||typeof S.gn!=='object')S.gn={};
  S.sel=Math.max(0,Math.min(4,Math.floor(+S.sel||0)));S.spent=+S.spent||0;S.made=+S.made||0;
  S.el=+S.el||0;S.warn=+S.warn||0;S.hints=S.hints||0;if(typeof S.line!=='number')S.line=-1;
  S.clues=S.clues.filter(function(c){return !!clueOf(c);});
  if(!avById(S.me))S.me='';
  if(S.me&&S.players.indexOf(S.me)<0)S.players.push(S.me);
  rebuildTeam();recalc();
}
function hsActive(h){
  var t=h.type;
  if(t==='help')return S.team.indexOf(h.id)<0;
  if(t==='clue'){if(!S.brief)return false;if(S.clues.indexOf(h.id)>=0)return false;if(h.id==='manifest')return S.brk.length>=NEEDB;return true;}
  if(t==='look')return S.acts.indexOf(h.id)<0;
  if(t==='gather')return nodeReady(h.id);
  if(t==='chest')return S.chests.indexOf(h.id)<0;
  if(t==='brk')return S.brk.indexOf(+h.id.slice(1))<0;
  if(t==='dog')return !S.dog;
  return true;
}
function hsLabel(h){
  var t=h.type,n;
  if(t==='trail')return 'Talk to '+TRAIL[TIDX[h.id]].who;
  if(t==='help')return 'Talk to '+avById(h.id).nick;
  if(t==='clue')return (S.clues.indexOf(h.id)>=0?'Look again: ':'Examine: ')+clueOf(h.id).n;
  if(t==='gather'){n=NODES.filter(function(q){return q.id===h.id;})[0].k;return 'Pick up the '+nm(n);}
  if(t==='chest')return 'Open the box';
  if(t==='craft')return 'Use the workbench';
  if(t==='brk')return 'Smash it!';
  if(t==='door')return 'Go into '+DOORS.filter(function(q){return q.id===h.id;})[0].n;
  if(t==='exit')return 'Step back outside';
  if(t==='dog')return 'Give Moti a biscuit';
  return (S.acts.indexOf(h.id)>=0?'Look again: ':'Examine: ')+LOOKS[h.id].n;
}
function trigger(h){

  else if(t==='gather')gather(h);else if(t==='chest')openChest(h);else if(t==='craft')craftView(h.id);
  else if(t==='door')doorGo(h);else if(t==='exit')exitGo(h);else if(t==='dog')feedDog();else if(t==='brk')smash(h);
  else lookView(h.id);
}

$('#btnTeam').onclick=function(){if(!sel)return;S.me=sel;if(S.players.indexOf(sel)<0)S.players.push(sel);rebuildTeam();saveState();sfx.stage();enter();};
fixState();
var ok3d=false;
try{if(window.THREE){init3D();ok3d=true;}}catch(e){ok3d=false;if(window.console)console.error(e);}
if(!ok3d){$('#introCard').textContent='The 3D junction could not load on this browser. Check your connection and reload the page.';$('#btnGo').disabled=true;}
else{
  chips();hud();
  showIntro();
  $('#btnGo').onclick=function(){
    audioInit();
    if(S.me){enter();return;}
    if(introStep===0){introStep=1;sfx.tap();showIntro();return;}
    $('#intro').hidden=true;$('#pick').hidden=false;renderPick();
  };
  $('#btnCam').onclick=function(){sfx.tap();enterShoot(false);};
  $('#shX').onclick=function(){exitShoot();};
  $('#shGo').onclick=function(){snap();};
  $('#btnRot').onclick=function(){if(paused)return;sfx.tap();if(inRoomNow){say('Can’t turn the view indoors.',2200,'View');return;}CA+=Math.PI/2;if(CA>6.2){CA-=Math.PI*2;CAc-=Math.PI*2;}$('#mini').style.transform='rotate('+Math.round(45+CA*57.2958)+'deg)';};
  $('#btnZi').onclick=function(){if(paused)return;sfx.tap();ZM=Math.min(2.4,ZM*1.4);applyCam();};
  $('#btnZo').onclick=function(){if(paused)return;sfx.tap();ZM=Math.max(ZLO,ZM/1.4);applyCam();};
  $('#mini').onclick=function(){mapView();};
}
})();
</script>
